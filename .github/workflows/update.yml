name: Update RSind rankings

on:
  schedule:
    # 11:45 UTC = 17:15 IST — runs ~1h45m after NSE close (15:30 IST), weekdays only.
    # India has no DST, so this UTC time is stable year-round.
    - cron: "45 11 * * 1-5"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch NSE price data
        run: python rs_data.py

      - name: Compute RS rankings
        run: python rs_ranking.py

      - name: Commit and push updated output
        run: |
          git config user.name "rsind-bot"
          git config user.email "actions@users.noreply.github.com"
          git add output/ data_persist/ data/
          git diff --cached --quiet || git commit -m "Daily RS update $(date -u +%Y-%m-%d)"
          git push
