name: Update RSind rankings

on:
  schedule:
    # 11:45 UTC = 17:15 IST — runs ~1h45m after NSE close (15:30 IST), weekdays only.
    # India has no DST, so this UTC time is stable year-round.
    - cron: "45 11 * * 1-5"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: rsind-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch NSE price data
        run: python rs_data.py

      - name: Compute RS rankings
        run: python rs_ranking.py

      - name: Commit and push updated output
        run: |
          git config user.name "rsind-bot"
          git config user.email "actions@users.noreply.github.com"
          # Only commit results — NOT data/, which holds a ~90MB scratch file of raw
          # price history that would blow past GitHub's 100MB per-file hard limit.
          git add output/ data_persist/
          git diff --cached --quiet && echo "No changes to commit." && exit 0
          git commit -m "Daily RS update $(date -u +%Y-%m-%d)"
          # Rebase onto whatever landed on the remote while we were running, so a
          # concurrent edit doesn't cause a rejected push. Retry a couple of times.
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done
          echo "Could not push after 3 attempts." && exit 1
