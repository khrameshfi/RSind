<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RSind — Indian Market RS Rating</title>
<style>
  /* ── Dark theme ──────────────────────────────────────────────────────── */
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --pos: #2f81f7;
    --neg: #f85149;
    --strong: #3fb950;
    --thbg: #1c2128;
    --hover: rgba(255,255,255,.035);
    --codebg: #21262d;
    --grid: rgba(255,255,255,.07);
    --ma: #d29922;
    --refline: #8b949e;
    --fill: rgba(47,129,247,.16);
    --shadow: rgba(0,0,0,.55);
  }
  /* ── Light theme (default) ───────────────────────────────────────────── */
  :root[data-theme="light"] {
    --bg: #ffffff;
    --panel: #f6f8fa;
    --border: #d0d7de;
    --text: #1f2328;
    --muted: #656d76;
    --pos: #0969da;
    --neg: #cf222e;
    --strong: #1a7f37;
    --thbg: #eaeef2;
    --hover: rgba(0,0,0,.035);
    --codebg: #eff1f3;
    --grid: rgba(0,0,0,.07);
    --ma: #9a6700;
    --refline: #8c959f;
    --fill: rgba(9,105,218,.12);
    --shadow: rgba(31,35,40,.22);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    transition: background .15s ease, color .15s ease;
  }
  header {
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
  }
  h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: .3px; }
  .sub { color: var(--muted); font-size: 12px; }
  .wrap { padding: 16px 20px 60px; }

  .filters {
    display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 14px; margin-bottom: 14px;
  }
  .f { display: flex; flex-direction: column; gap: 5px; }
  .f label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .f input, .f select {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 8px; font-size: 13px; min-width: 110px;
  }
  .f input.narrow { min-width: 92px; }
  .f input:focus, .f select:focus { outline: none; border-color: var(--pos); }
  button {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 7px 12px; font-size: 13px; cursor: pointer;
  }
  button:hover { border-color: var(--muted); }
  button.primary { background: rgba(47,129,247,.15); border-color: rgba(47,129,247,.5); color: var(--pos); }
  button.primary:hover { background: rgba(47,129,247,.25); border-color: var(--pos); }
  #theme { margin-left: 8px; white-space: nowrap; }
  .chip {
    display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 12px;
    background: rgba(47,129,247,.12); border: 1px solid rgba(47,129,247,.35); color: var(--pos);
  }

  .tablebox { border: 1px solid var(--border); border-radius: 8px; overflow: auto; background: var(--panel); }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { padding: 8px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--border); }
  th {
    position: sticky; top: 0; background: var(--thbg); z-index: 2;
    font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted);
    cursor: pointer; user-select: none;
  }
  th:hover { color: var(--text); }
  th.sorted { color: var(--pos); }
  td.l, th.l { text-align: left; }
  tbody tr:hover { background: var(--hover); }
  .tk { font-weight: 600; }
  .tk a { color: var(--text); text-decoration: none; }
  .tk a:hover { color: var(--pos); text-decoration: underline; }
  .rs { font-weight: 700; }
  .rs-99 { color: var(--strong); }
  .rs-90 { color: var(--pos); }
  .rs-70 { color: var(--text); }
  .rs-lo { color: var(--muted); }
  .trend { font-size: 12px; color: var(--muted); }
  .up { color: var(--strong); }
  .down { color: var(--neg); }
  .links a {
    color: var(--muted); text-decoration: none; font-size: 11px;
    border: 1px solid var(--border); border-radius: 4px; padding: 2px 6px; margin-left: 4px;
  }
  .links a:hover { color: var(--pos); border-color: var(--pos); }
  .sector { color: var(--muted); font-size: 12px; max-width: 190px; overflow: hidden; text-overflow: ellipsis; }
  .msg { padding: 40px 20px; text-align: center; color: var(--muted); }
  .err { color: var(--neg); }
  code { background: var(--codebg); padding: 1px 5px; border-radius: 4px; font-size: 12px; }

  /* ── Hover chart preview (self-drawn — see note in the script) ────────── */
  .preview {
    position: fixed; z-index: 60; width: 620px; height: 400px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 12px 32px var(--shadow); overflow: hidden;
    display: flex; flex-direction: column;
  }
  .preview[hidden] { display: none; }
  .preview-hd {
    display: flex; align-items: baseline; gap: 10px;
    padding: 8px 12px; border-bottom: 1px solid var(--border);
    font-size: 12px; background: var(--thbg);
  }
  .preview-hd .sym { font-weight: 700; font-size: 13px; }
  .preview-hd .hint { color: var(--muted); margin-left: auto; font-size: 11px; font-variant-numeric: tabular-nums; }
  #chartbox { flex: 1; min-height: 0; position: relative; }
  #pvcanvas { display: block; width: 100%; height: 100%; }
  .pvload {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 0 26px; color: var(--muted); font-size: 12px; line-height: 1.5;
  }
  .preview-ft {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 6px 12px; border-top: 1px solid var(--border);
    font-size: 11px; color: var(--muted); background: var(--thbg);
  }
  .preview-ft i { display: inline-block; width: 14px; height: 0; vertical-align: middle;
                  border-top: 2px solid currentColor; margin-right: 5px; }
  .k-px { color: var(--pos); }
  .k-ma { color: var(--ma); }
  .k-ref { color: var(--refline); }
  .k-hi { color: var(--strong); }
  .toggle { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text); cursor: pointer; padding: 7px 0; }
  .toggle input { width: auto; min-width: 0; }
  @media (max-width: 820px) { .preview { display: none !important; } }
</style>
</head>
<body>
<header>
  <h1>RSind</h1>
  <span class="sub">IBD-style Relative Strength Rating &middot; NSE universe vs Nifty&nbsp;50</span>
  <span class="sub" id="meta" style="margin-left:auto"></span>
  <button id="theme" title="Switch between light and dark">&#9728; Light</button>
</header>

<div class="wrap">
  <div class="filters">
    <div class="f">
      <label>Search</label>
      <input id="q" type="text" placeholder="Ticker or sector" autocomplete="off">
    </div>
    <div class="f">
      <label>Min RS Rating</label>
      <input id="minrs" class="narrow" type="number" value="90" min="0" max="99" step="1">
    </div>
    <div class="f">
      <label>Max % off 52wk high</label>
      <input id="maxoff" class="narrow" type="number" value="25" min="0" max="100" step="1">
    </div>
    <div class="f">
      <label>Min avg vol (50d)</label>
      <input id="minvol" type="number" value="100000" min="0" step="50000">
    </div>
    <div class="f">
      <label>Mkt cap &#8377;Cr (min / max)</label>
      <div style="display:flex;gap:6px">
        <input id="mincap" class="narrow" type="number" placeholder="min" min="0" step="100">
        <input id="maxcap" class="narrow" type="number" placeholder="max" min="0" step="100">
      </div>
    </div>
    <div class="f">
      <label>Sector</label>
      <select id="sector"><option value="">All</option></select>
    </div>
    <div class="f">
      <label>&nbsp;</label>
      <button id="reset">Reset</button>
    </div>
    <div class="f">
      <label>Chart preview</label>
      <label class="toggle"><input id="hoverchk" type="checkbox" checked> Show on hover</label>
    </div>
    <div class="f">
      <label>Export current list</label>
      <div style="display:flex;gap:6px">
        <button id="dl" class="primary">&#8681; TradingView .txt</button>
        <button id="cp">Copy symbols</button>
      </div>
    </div>
    <div class="f" style="margin-left:auto">
      <label>&nbsp;</label>
      <span class="chip" id="count">&mdash;</span>
    </div>
  </div>

  <div class="tablebox">
    <table>
      <thead>
        <tr>
          <th class="l" data-k="Ticker">Ticker</th>
          <th data-k="Percentile">RS</th>
          <th data-k="_trend">RS Trend<br><span style="font-weight:400;text-transform:none">6M&rarr;3M&rarr;1M</span></th>
          <th data-k="Price">Price</th>
          <th data-k="PctFrom52WkHigh">% off high</th>
          <th data-k="AvgVol50">Avg Vol 50d</th>
          <th data-k="MarketCap">Mkt Cap</th>
          <th class="l" data-k="Sector">Sector</th>
          <th class="l">Open in</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div class="msg" id="msg">Loading rankings&hellip;</div>
</div>

<div class="preview" id="preview" hidden>
  <div class="preview-hd">
    <span class="sym" id="pvsym"></span>
    <span id="pvmeta" class="sub"></span>
    <span class="hint" id="pvread">click ticker for TradingView &middot; Esc to close</span>
  </div>
  <div id="chartbox">
    <canvas id="pvcanvas"></canvas>
    <div class="pvload" id="pvmsg">Loading price data&hellip;</div>
  </div>
  <div class="preview-ft">
    <span><i class="k-px"></i>Close</span>
    <span><i class="k-ma"></i>50-DMA</span>
    <span><i class="k-ref"></i>Nifty 50 rebased</span>
    <span><i class="k-hi"></i>Period high</span>
    <span id="pvchg" style="margin-left:auto"></span>
  </div>
</div>

<script>
// ── Config ────────────────────────────────────────────────────────────────
// Served from GitHub Pages at the repo root, so the data sits alongside this file.
const CSV_PATH = "output/rs_stocks.csv";
const HIST_PATH = "output/history.json";

// TradingView caps an imported watchlist at 1,000 symbols.
const TV_LIMIT = 1000;
const CRORE = 1e7;

// ── Theme ─────────────────────────────────────────────────────────────────
// Light is the default. A preference is only stored once you actually click the
// toggle — so the default applies cleanly until you choose otherwise.
const THEME_KEY = "rsind-theme-v2";
const themeBtn = document.getElementById("theme");
function setTheme(t, persist) {
  document.documentElement.setAttribute("data-theme", t);
  themeBtn.textContent = t === "dark" ? "☀ Light" : "🌙 Dark";
  if (persist) { try { localStorage.setItem(THEME_KEY, t); } catch (e) {} }
}
(function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
  setTheme(saved === "dark" || saved === "light" ? saved : "light", false);
})();
themeBtn.addEventListener("click", () => {
  setTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark", true);
  if (CHART) renderChart();          // repaint the open chart in the new palette
});

// ── Minimal CSV parser (handles quoted fields, which pandas emits for
//    values containing commas — e.g. some industry names) ──────────────────
function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQ = false;
      } else field += c;
    } else if (c === '"') inQ = true;
    else if (c === ',') { row.push(field); field = ""; }
    else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ""; }
    else if (c !== '\r') field += c;
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  if (!rows.length) return [];
  const head = rows.shift().map(h => h.trim());
  return rows.filter(r => r.length > 1).map(r => {
    const o = {};
    head.forEach((h, i) => o[h] = (r[i] ?? "").trim());
    return o;
  });
}

const num = v => { const n = parseFloat(v); return isNaN(n) ? null : n; };

const fmtVol = v => v == null ? "—"
  : v >= 1e7 ? (v / 1e7).toFixed(1) + "Cr"
  : v >= 1e5 ? (v / 1e5).toFixed(1) + "L"
  : v >= 1e3 ? (v / 1e3).toFixed(0) + "K" : String(v);

// Indian convention: crore (1e7) and lakh (1e5), with en-IN digit grouping
// (##,##,###) — matches how screener.in and Indian brokers display market cap.
const fmtCap = v => {
  if (v == null) return "—";
  if (v >= CRORE) return "₹" + Math.round(v / CRORE).toLocaleString("en-IN") + " Cr";
  if (v >= 1e5)   return "₹" + (v / 1e5).toFixed(1) + " L";
  return "₹" + Math.round(v).toLocaleString("en-IN");
};

let DATA = [], CURRENT = [], sortKey = "Percentile", sortDir = -1;

function rsClass(p) {
  if (p >= 95) return "rs rs-99";
  if (p >= 85) return "rs rs-90";
  if (p >= 60) return "rs rs-70";
  return "rs rs-lo";
}

// RS trend: 6M -> 3M -> 1M percentile, with an arrow showing overall direction.
function trendCell(r) {
  const a = num(r["6M_RS_Percentile"]), b = num(r["3M_RS_Percentile"]), c = num(r["1M_RS_Percentile"]);
  if (a == null || b == null || c == null) return '<span class="trend">—</span>';
  const now = num(r["Percentile"]);
  const delta = (now != null ? now : c) - a;
  const cls = delta > 5 ? "up" : delta < -5 ? "down" : "";
  const arrow = delta > 5 ? "▲" : delta < -5 ? "▼" : "▬";
  return `<span class="trend">${a} → ${b} → ${c} <span class="${cls}">${arrow}</span></span>`;
}

function apply() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const minrs = num(document.getElementById("minrs").value) ?? 0;
  const maxoff = num(document.getElementById("maxoff").value);
  const minvol = num(document.getElementById("minvol").value) ?? 0;
  const sector = document.getElementById("sector").value;
  // Market-cap box values are in CRORES; convert to raw rupees for comparison.
  const mincapCr = num(document.getElementById("mincap").value);
  const maxcapCr = num(document.getElementById("maxcap").value);

  let out = DATA.filter(r => {
    const p = num(r["Percentile"]);
    if (p == null || p < minrs) return false;

    const off = num(r["PctFrom52WkHigh"]);           // negative = below the high
    if (maxoff != null && off != null && Math.abs(off) > maxoff) return false;

    const v = num(r["AvgVol50"]);
    if (v != null && v < minvol) return false;

    // Only filter on market cap when a value is actually typed. Stocks with no
    // cap data are excluded once a cap filter is active, since we can't verify them.
    if (mincapCr != null || maxcapCr != null) {
      const cap = num(r["MarketCap"]);
      if (cap == null) return false;
      if (mincapCr != null && cap < mincapCr * CRORE) return false;
      if (maxcapCr != null && cap > maxcapCr * CRORE) return false;
    }

    if (sector && r["Sector"] !== sector) return false;
    if (q) {
      const hay = (r["Ticker"] + " " + r["Sector"] + " " + r["Industry"]).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  out.sort((x, y) => {
    let a, b;
    if (sortKey === "_trend") {
      a = (num(x["Percentile"]) ?? 0) - (num(x["6M_RS_Percentile"]) ?? 0);
      b = (num(y["Percentile"]) ?? 0) - (num(y["6M_RS_Percentile"]) ?? 0);
    } else if (sortKey === "Ticker" || sortKey === "Sector") {
      return (x[sortKey] || "").localeCompare(y[sortKey] || "") * sortDir;
    } else {
      a = num(x[sortKey]); b = num(y[sortKey]);
    }
    if (a == null) return 1;
    if (b == null) return -1;
    return (a - b) * sortDir;
  });

  CURRENT = out;
  document.getElementById("count").textContent =
    out.length + " of " + DATA.length + " stocks";

  document.getElementById("rows").innerHTML = out.slice(0, 500).map(r => {
    const t = r["Ticker"], p = num(r["Percentile"]);
    const off = num(r["PctFrom52WkHigh"]);
    return `<tr data-sym="${t}" data-rs="${p ?? ""}">
      <td class="l tk"><a href="https://www.tradingview.com/chart/?symbol=NSE%3A${encodeURIComponent(t)}" target="_blank" rel="noopener">${t}</a></td>
      <td class="${rsClass(p)}">${p ?? "—"}</td>
      <td>${trendCell(r)}</td>
      <td>${num(r["Price"]) != null ? "₹" + num(r["Price"]).toFixed(2) : "—"}</td>
      <td class="${off != null && off < -15 ? "down" : ""}">${off != null ? off.toFixed(1) + "%" : "—"}</td>
      <td>${fmtVol(num(r["AvgVol50"]))}</td>
      <td>${fmtCap(num(r["MarketCap"]))}</td>
      <td class="l sector" title="${(r["Industry"] || "").replace(/"/g, "&quot;")}">${r["Sector"] || "—"}</td>
      <td class="l links">
        <a href="https://www.tradingview.com/chart/?symbol=NSE%3A${encodeURIComponent(t)}" target="_blank" rel="noopener">TV</a>
        <a href="https://www.screener.in/company/${encodeURIComponent(t)}/" target="_blank" rel="noopener">Screener</a>
      </td>
    </tr>`;
  }).join("");

  document.getElementById("msg").style.display = out.length ? "none" : "block";
  if (!out.length) document.getElementById("msg").textContent = "No stocks match these filters.";
}

// ── Export to TradingView ────────────────────────────────────────────────
// TradingView's "Upload list…" expects a .txt of comma-separated symbols,
// each carrying its exchange prefix (NSE:TICKER). Max 1,000 per list.
function tvSymbols() {
  return CURRENT.slice(0, TV_LIMIT).map(r => "NSE:" + r["Ticker"]);
}

function flash(btn, msg) {
  const old = btn.dataset.label || btn.textContent;
  btn.dataset.label = old;
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = btn.dataset.label; }, 2000);
}

document.getElementById("dl").addEventListener("click", e => {
  const btn = e.currentTarget;
  if (!CURRENT.length) return flash(btn, "Nothing to export");
  const syms = tvSymbols();
  const blob = new Blob([syms.join(",")], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const rs = document.getElementById("minrs").value;
  a.href = url;
  a.download = `RSind_RS${rs}plus_${new Date().toISOString().slice(0, 10)}.txt`;
  a.click();
  URL.revokeObjectURL(url);
  flash(btn, CURRENT.length > TV_LIMIT
    ? `Saved top ${TV_LIMIT} of ${CURRENT.length}`
    : `Saved ${syms.length} symbols`);
});

document.getElementById("cp").addEventListener("click", async e => {
  const btn = e.currentTarget;
  if (!CURRENT.length) return flash(btn, "Nothing to copy");
  const syms = tvSymbols();
  const text = syms.join(",");
  const note = CURRENT.length > TV_LIMIT
    ? `Copied top ${TV_LIMIT} of ${CURRENT.length}`
    : `Copied ${syms.length} symbols`;
  try {
    await navigator.clipboard.writeText(text);
    flash(btn, note);
  } catch (err) {
    // Clipboard API needs a secure context; fall back to a manual prompt.
    window.prompt(note + " — press Ctrl/Cmd+C:", text);
  }
});

// ── Hover chart preview ───────────────────────────────────────────────────
// This used to embed TradingView's Advanced Chart widget, but that widget does
// not carry NSE data for anonymous embeds — every Indian ticker comes back with
// "This symbol is only available on TradingView" (verified: NASDAQ:AAPL renders,
// NSE:HFCL and NSE:INDSWFTLAB do not). So the chart is drawn here instead, from
// output/history.json, which the pipeline writes alongside the rankings.
const preview  = document.getElementById("preview");
const chartbox = document.getElementById("chartbox");
const cv       = document.getElementById("pvcanvas");
const pvmsg    = document.getElementById("pvmsg");
const pvsym    = document.getElementById("pvsym");
const pvmeta   = document.getElementById("pvmeta");
const pvread   = document.getElementById("pvread");
const pvchg    = document.getElementById("pvchg");
const hoverchk = document.getElementById("hoverchk");

const HOVER_DELAY = 300;   // ms of dwell before a chart loads
const HIDE_GRACE  = 220;   // ms to allow moving the cursor into the panel
const HINT_TEXT   = "click ticker for TradingView · Esc to close";
let showTimer = null, hideTimer = null, shownSym = null, pinned = false;

try {
  if (localStorage.getItem("rsind-hover") === "0") hoverchk.checked = false;
} catch (e) {}
hoverchk.addEventListener("change", () => {
  try { localStorage.setItem("rsind-hover", hoverchk.checked ? "1" : "0"); } catch (e) {}
  if (!hoverchk.checked) hidePreview(true);
});

// ── Price history (lazy — only fetched the first time you hover a row) ─────
let HIST = null, histPromise = null;
function loadHistory() {
  if (!histPromise) {
    histPromise = fetch(HIST_PATH)
      .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(j => { HIST = j; return j; });
  }
  return histPromise;
}

function showMsg(html) {
  pvmsg.innerHTML = html;
  pvmsg.style.display = "flex";
  cv.style.display = "none";
  pvchg.textContent = "";
}

// ── Chart drawing ─────────────────────────────────────────────────────────
const PAD = { l: 8, r: 56, t: 12, b: 20 };
let CHART = null;   // prepared series for whatever is on screen

const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function sma(arr, n) {
  const out = new Array(arr.length).fill(null);
  let sum = 0;
  for (let i = 0; i < arr.length; i++) {
    sum += arr[i];
    if (i >= n) sum -= arr[i - n];
    if (i >= n - 1) out[i] = sum / n;
  }
  return out;
}

function prepareChart(sym) {
  const rec = HIST && HIST.series && HIST.series[sym];
  if (!rec) return null;

  const closes = rec.c;
  const dates  = HIST.dates.slice(rec.s);
  const ma     = closes.length > 50 ? sma(closes, 50) : null;

  // Nifty 50 rebased to the stock's first close, so the two lines are comparable.
  let ref = null;
  const refRec = HIST.series[HIST.ref];
  if (refRec && refRec.c.length >= closes.length) {
    const seg = refRec.c.slice(refRec.c.length - closes.length);
    if (seg[0]) { const k = closes[0] / seg[0]; ref = seg.map(v => v * k); }
  }

  const hi = Math.max(...closes);
  let lo = Math.min(...closes), up = hi;
  if (ref) { lo = Math.min(lo, ...ref); up = Math.max(up, ...ref); }
  if (ma) { for (const v of ma) if (v != null) { lo = Math.min(lo, v); up = Math.max(up, v); } }
  const padY = (up - lo) * 0.06 || 1;

  return { sym, closes, dates, ma, ref, hi, min: lo - padY, max: up + padY };
}

function renderChart(cursor) {
  if (!CHART) return;
  const { closes, dates, ma, ref, hi, min, max } = CHART;
  const n = closes.length;

  const dpr = window.devicePixelRatio || 1;
  const w = chartbox.clientWidth, h = chartbox.clientHeight;
  if (!w || !h) return;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  const g = cv.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);

  const iw = w - PAD.l - PAD.r, ih = h - PAD.t - PAD.b;
  const X = i => PAD.l + (n === 1 ? iw / 2 : i * iw / (n - 1));
  const Y = v => PAD.t + (max - v) * ih / (max - min);

  const cText = cssVar("--text"), cMuted = cssVar("--muted"), cGrid = cssVar("--grid");
  const cPos = cssVar("--pos"), cMa = cssVar("--ma"), cRef = cssVar("--refline");
  const cHi = cssVar("--strong"), cFill = cssVar("--fill");
  g.font = "10px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
  g.textBaseline = "middle";

  // Horizontal grid + right-hand price scale
  g.strokeStyle = cGrid; g.fillStyle = cMuted; g.lineWidth = 1;
  for (let k = 0; k <= 4; k++) {
    const v = min + (max - min) * k / 4, y = Math.round(Y(v)) + 0.5;
    g.beginPath(); g.moveTo(PAD.l, y); g.lineTo(w - PAD.r, y); g.stroke();
    g.textAlign = "left";
    g.fillText("₹" + v.toFixed(v < 100 ? 1 : 0), w - PAD.r + 6, Y(v));
  }

  // Month markers along the bottom
  g.textAlign = "center";
  let lastMonth = -1;
  for (let i = 0; i < n; i++) {
    const d = new Date(dates[i] * 1000), m = d.getMonth();
    if (m !== lastMonth) {
      lastMonth = m;
      const x = X(i);
      if (x > PAD.l + 14 && x < w - PAD.r - 14) {
        g.strokeStyle = cGrid;
        g.beginPath(); g.moveTo(Math.round(x) + 0.5, PAD.t); g.lineTo(Math.round(x) + 0.5, h - PAD.b); g.stroke();
        g.fillStyle = cMuted;
        g.fillText(d.toLocaleDateString("en-IN", { month: "short" }), x, h - PAD.b / 2 - 1);
      }
    }
  }

  const line = (arr, colour, width, dash) => {
    g.save();
    g.strokeStyle = colour; g.lineWidth = width; g.setLineDash(dash || []);
    g.beginPath();
    let started = false;
    for (let i = 0; i < arr.length; i++) {
      if (arr[i] == null) { started = false; continue; }
      const x = X(i), y = Y(arr[i]);
      if (started) g.lineTo(x, y); else { g.moveTo(x, y); started = true; }
    }
    g.stroke(); g.restore();
  };

  // Period high
  g.save();
  g.strokeStyle = cHi; g.lineWidth = 1; g.setLineDash([4, 4]); g.globalAlpha = .7;
  g.beginPath(); g.moveTo(PAD.l, Y(hi)); g.lineTo(w - PAD.r, Y(hi)); g.stroke();
  g.restore();

  if (ref) line(ref, cRef, 1, [3, 3]);
  if (ma)  line(ma, cMa, 1.25);

  // Close line + area fill
  g.save();
  g.beginPath();
  g.moveTo(X(0), Y(closes[0]));
  for (let i = 1; i < n; i++) g.lineTo(X(i), Y(closes[i]));
  g.lineTo(X(n - 1), h - PAD.b); g.lineTo(X(0), h - PAD.b); g.closePath();
  g.fillStyle = cFill; g.fill();
  g.restore();
  line(closes, cPos, 1.75);

  // Crosshair readout
  if (cursor != null && cursor >= 0 && cursor < n) {
    const x = Math.round(X(cursor)) + 0.5, v = closes[cursor];
    g.save();
    g.strokeStyle = cMuted; g.lineWidth = 1; g.setLineDash([2, 3]); g.globalAlpha = .8;
    g.beginPath(); g.moveTo(x, PAD.t); g.lineTo(x, h - PAD.b); g.stroke();
    g.restore();
    g.fillStyle = cPos;
    g.beginPath(); g.arc(X(cursor), Y(v), 3, 0, Math.PI * 2); g.fill();
    const d = new Date(dates[cursor] * 1000);
    pvread.textContent =
      d.toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "2-digit" }) +
      "  ₹" + v.toFixed(2);
    g.fillStyle = cText;
  } else {
    pvread.textContent = HINT_TEXT;
  }

  const chg = (closes[n - 1] / closes[0] - 1) * 100;
  const offHi = (closes[n - 1] / hi - 1) * 100;
  pvchg.innerHTML =
    `<span class="${chg >= 0 ? "up" : "down"}">${chg >= 0 ? "+" : ""}${chg.toFixed(1)}%</span>` +
    ` over ${Math.round(n / 21)}M · ${offHi.toFixed(1)}% off high`;
}

function drawFor(sym) {
  CHART = prepareChart(sym);
  if (!CHART) {
    showMsg("No price history for <b>" + sym + "</b> yet.<br>" +
            "It needs at least ~2 months of trading data.");
    return;
  }
  pvmsg.style.display = "none";
  cv.style.display = "block";
  renderChart();
}

chartbox.addEventListener("mousemove", e => {
  if (!CHART || cv.style.display === "none") return;
  const r = cv.getBoundingClientRect();
  const iw = r.width - PAD.l - PAD.r;
  const i = Math.round((e.clientX - r.left - PAD.l) * (CHART.closes.length - 1) / iw);
  renderChart(Math.max(0, Math.min(CHART.closes.length - 1, i)));
});
chartbox.addEventListener("mouseleave", () => { if (CHART) renderChart(); });

function positionPreview(anchorRect) {
  const w = preview.offsetWidth || 620, h = preview.offsetHeight || 400;
  const pad = 12;
  // Prefer the right of the table row; flip left if it would overflow.
  let left = anchorRect.right + pad;
  if (left + w > window.innerWidth - pad) left = anchorRect.left - w - pad;
  if (left < pad) left = Math.max(pad, window.innerWidth - w - pad);
  let top = anchorRect.top - 40;
  top = Math.min(Math.max(pad, top), window.innerHeight - h - pad);
  preview.style.left = left + "px";
  preview.style.top = top + "px";
}

function showPreview(tr) {
  const sym = tr.dataset.sym;
  if (!sym) return;
  positionPreview(tr.getBoundingClientRect());
  preview.hidden = false;
  if (sym === shownSym) return;

  shownSym = sym;
  CHART = null;
  pvsym.textContent = "NSE:" + sym;
  pvmeta.textContent = tr.dataset.rs ? "RS " + tr.dataset.rs : "";
  pvread.textContent = HINT_TEXT;

  if (HIST) { drawFor(sym); return; }

  showMsg("Loading price data…");
  loadHistory()
    .then(() => { if (shownSym === sym) drawFor(sym); })
    .catch(err => {
      if (shownSym !== sym) return;
      showMsg("Could not load <code>" + HIST_PATH + "</code> (" + err.message + ").<br>" +
              "It is written by the <b>Update RSind rankings</b> workflow — " +
              "run it once and this chart will appear.");
    });
}

function hidePreview(immediate) {
  clearTimeout(hideTimer);
  const doHide = () => {
    if (pinned) return;
    preview.hidden = true;
    shownSym = null;
    CHART = null;
  };
  if (immediate) { pinned = false; doHide(); }
  else hideTimer = setTimeout(doHide, HIDE_GRACE);
}

document.getElementById("rows").addEventListener("mouseover", e => {
  if (!hoverchk.checked || pinned) return;
  const tr = e.target.closest("tr[data-sym]");
  if (!tr) return;
  clearTimeout(hideTimer);
  clearTimeout(showTimer);
  showTimer = setTimeout(() => showPreview(tr), HOVER_DELAY);
});
document.getElementById("rows").addEventListener("mouseout", e => {
  if (pinned) return;
  const to = e.relatedTarget;
  if (to && (to.closest("tr[data-sym]") || to.closest("#preview"))) return;
  clearTimeout(showTimer);
  hidePreview(false);
});
// Keep it open while the cursor is inside the panel.
preview.addEventListener("mouseenter", () => clearTimeout(hideTimer));
preview.addEventListener("mouseleave", () => hidePreview(false));
document.addEventListener("keydown", e => { if (e.key === "Escape") hidePreview(true); });
window.addEventListener("scroll", () => hidePreview(true), { passive: true });

// ── Table wiring ──────────────────────────────────────────────────────────
document.querySelectorAll("th[data-k]").forEach(th => {
  th.addEventListener("click", () => {
    const k = th.dataset.k;
    if (sortKey === k) sortDir *= -1;
    else { sortKey = k; sortDir = (k === "Ticker" || k === "Sector") ? 1 : -1; }
    document.querySelectorAll("th").forEach(x => x.classList.remove("sorted"));
    th.classList.add("sorted");
    apply();
  });
});

["q", "minrs", "maxoff", "minvol", "mincap", "maxcap", "sector"].forEach(id =>
  document.getElementById(id).addEventListener("input", apply));

document.getElementById("reset").addEventListener("click", () => {
  document.getElementById("q").value = "";
  document.getElementById("minrs").value = 90;
  document.getElementById("maxoff").value = 25;
  document.getElementById("minvol").value = 100000;
  document.getElementById("mincap").value = "";
  document.getElementById("maxcap").value = "";
  document.getElementById("sector").value = "";
  apply();
});

fetch(CSV_PATH + "?t=" + Date.now())
  .then(r => {
    if (!r.ok) throw new Error("HTTP " + r.status);
    const lm = r.headers.get("last-modified");
    if (lm) document.getElementById("meta").textContent =
      "Data updated " + new Date(lm).toLocaleString();
    return r.text();
  })
  .then(txt => {
    DATA = parseCSV(txt);
    if (!DATA.length) throw new Error("CSV parsed but empty");
    const sectors = [...new Set(DATA.map(r => r["Sector"]).filter(s => s && s !== "unknown" && s !== "n/a"))].sort();
    const sel = document.getElementById("sector");
    sectors.forEach(s => {
      const o = document.createElement("option");
      o.value = o.textContent = s;
      sel.appendChild(o);
    });
    document.querySelector('th[data-k="Percentile"]').classList.add("sorted");
    apply();
  })
  .catch(e => {
    document.getElementById("msg").innerHTML =
      '<span class="err">Could not load ' + CSV_PATH + ' (' + e.message + ').</span><br><br>' +
      'This is expected until the first successful run of the <code>Update RSind rankings</code> ' +
      'workflow finishes and commits <code>output/rs_stocks.csv</code>.';
  });
</script>
